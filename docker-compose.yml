version: '3.8'

services:
  # 1. Le Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - API_INTERNAL_URL=http://api:4000

  # 2. Le Backend (FastAPI + Python AI Agents)
  api:
    build:
      context: .
      dockerfile: apps/api-python/Dockerfile
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=4000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # 3. Base de données Redis Locale (remplace Upstash qui est limité)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  redis-data:
